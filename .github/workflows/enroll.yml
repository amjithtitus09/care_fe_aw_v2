name: Pipeline — Enroll

# Entry point of the linear Jira -> mergeable-PR pipeline (see docs/PIPELINE.md).
#
# Plain, deterministic (non-agentic): enrolling a PR is a conditional label write.
#
# When a PR carries `jira-agent`, has NO `state:*` label yet, and its head commit's deterministic
# CI has COMPLETED (green OR red — we do not require green; the review stage folds CI in and routes
# a red PR to rework), add `state:review` to start the pipeline.
#
# Why wait for CI to complete: the review stage judges code AND CI together, so it should see a
# final CI verdict rather than a pending one.
#
# Why `workflow_run` (NOT `check_suite`): GitHub deliberately does NOT dispatch `check_suite` /
# `check_run` events for suites created by GitHub Actions (recursion prevention), so a
# check_suite-triggered enroll never re-fires after CI finishes and the PR stalls at `jira-agent`.
# `workflow_run` DOES fire when a named workflow completes. The set of workflows we trigger on is
# exactly the set we gate on (GATING_CI), so there is no "which check was last" race.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_run:
    # Deterministic CI whose completion means "code CI is done". Keep in sync with GATING_CI below.
    workflows: ["Lint Code Base", "Unit Tests", "Build PR Preview", "Playwright Tests"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: pipeline-enroll-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  enroll:
    runs-on: ubuntu-latest
    # Label events: act only when the added label is `jira-agent` (or open/reopen of a PR that
    # already carries it). workflow_run events are filtered in-script (PR located from head SHA).
    if: >-
      github.event_name == 'workflow_run' ||
      (contains(github.event.pull_request.labels.*.name, 'jira-agent') &&
       (github.event.action != 'labeled' || github.event.label.name == 'jira-agent'))
    steps:
      - name: Enroll when eligible and CI has completed
        env:
          # PAT so the `state:review` label event cascades past the recursion guard to trigger
          # pr-review. Falls back to GITHUB_TOKEN (label set, but the review stage won't fire).
          GH_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Deterministic CI workflows we wait on — MUST match the workflow_run trigger list above.
          GATING_CI: 'Lint Code Base|Unit Tests|Build PR Preview|Playwright Tests'
        run: |
          set -euo pipefail

          # Resolve the PR under evaluation.
          if [ "$EVENT" = "workflow_run" ]; then
            PR_NUMBER="$(gh pr list --repo "$REPO" --state open \
              --search "$HEAD_SHA" --json number --jq '.[0].number' || true)"
            if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "No open PR for $HEAD_SHA — nothing to enrol."; exit 0
            fi
          fi

          labels="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')"

          # Must be opted in.
          if ! printf '%s\n' "$labels" | grep -qx 'jira-agent'; then
            echo "PR #$PR_NUMBER is not jira-agent enrolled — skipping."; exit 0
          fi
          # Mutual exclusivity: only enrol if the PR carries no state:* label yet.
          if printf '%s\n' "$labels" | grep -q '^state:'; then
            echo "PR #$PR_NUMBER already in a state:* stage — nothing to enrol."; exit 0
          fi

          # Keep the PR branch current with the default branch BEFORE enrolling. GitHub runs
          # `pull_request`-triggered agentic stages (review/qa/rework) from the PR HEAD branch's
          # workflow files — so an agent PR opened before a pipeline update would otherwise run a
          # STALE QA/review workflow. update-branch merges the base in (best-effort, same-repo only,
          # no-op when already current, safe-fails on conflict). The resulting sync commit re-runs CI;
          # this enroll run then exits (checks pending) and the workflow_run trigger re-evaluates.
          headRepo="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRepositoryOwner,isCrossRepository --jq '{x:.isCrossRepository}' | jq -r '.x')"
          behind="$(gh api "repos/$REPO/compare/${DEFAULT_BRANCH}...$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')" --jq '.behind_by // 0' 2>/dev/null || echo 0)"
          if [ "$headRepo" != "true" ] && [ "${behind:-0}" -gt 0 ]; then
            echo "PR #$PR_NUMBER is $behind commit(s) behind ${DEFAULT_BRANCH} — updating branch so it runs the current workflows."
            gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1 \
              && { echo "Branch updated; CI will re-run and enrol re-evaluates on completion."; exit 0; } \
              || echo "::warning::could not auto-update PR #$PR_NUMBER branch (conflict?); continuing with its current workflow."
          fi

          # Gate ONLY on the deterministic CI workflows (green or red). Ignore our own agentic
          # checks and everything else (scanning, deploys, label bots).
          checks="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json state,name,workflow 2>/dev/null || echo '[]')"
          ci="$(printf '%s' "$checks" | jq --arg g "$GATING_CI" '[.[] | select((.workflow // "") | test($g))]')"
          total="$(printf '%s' "$ci" | jq 'length')"
          pending="$(printf '%s' "$ci" | jq '[.[] | select(.state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS")] | length')"
          if [ "$total" -eq 0 ]; then
            echo "PR #$PR_NUMBER has no gating CI checks yet — waiting for CI to appear."; exit 0
          fi
          if [ "$pending" -gt 0 ]; then
            echo "PR #$PR_NUMBER has $pending pending gating CI checks — will re-evaluate when CI completes."; exit 0
          fi

          echo "Gating CI complete on PR #$PR_NUMBER — enrolling into the pipeline (state:review)."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label 'state:review'
